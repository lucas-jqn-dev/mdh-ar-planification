services:
  - name: mdh-ar-planificador
    type: web
    runtime: node
    plan: free
    # NODE_ENV=development inline + --include=dev, los dos a propósito: con
    # NODE_ENV=production seteado más abajo (que necesita el runtime, para
    # cookies secure y deshabilitar Swagger), un "npm install" a secas se
    # saltea devDependencies — y ahí viven las herramientas de build
    # (@nestjs/cli, @angular/cli, typescript), así que "nest build"/"ng
    # build" fallarían con "not found". El override inline sobre el install
    # es la garantía real (funciona igual sin importar la versión de npm
    # que use la imagen de Render); --include=dev queda como refuerzo.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      # Connection string de MongoDB Atlas (Database > Connect > Drivers).
      - key: MONGODB_URI
        sync: false
      # Generados automáticamente por Render, uno independiente del otro.
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      # URL pública de este mismo servicio una vez creado (ej.
      # https://mdh-ar-planificador.onrender.com). En este deploy de un solo
      # servicio el navegador nunca hace una request cross-origin real, así
      # que este valor casi no se ejercita — se pide igual para no dejar
      # el default de desarrollo (localhost:4200) activo en producción.
      - key: CORS_ORIGIN
        sync: false
