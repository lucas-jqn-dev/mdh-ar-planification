<mat-sidenav-container class="shell">
  <mat-sidenav
    #drawer
    class="shell-sidenav"
    [mode]="isHandset() ? 'over' : 'side'"
    [opened]="!isHandset()"
  >
    <mat-nav-list>
      @for (item of navItems; track item.path) {
        <a
          mat-list-item
          [routerLink]="item.path"
          routerLinkActive="active-link"
          (click)="isHandset() && drawer.close()"
        >
          <mat-icon matListItemIcon>{{ item.icon }}</mat-icon>
          <span matListItemTitle>{{ item.label }}</span>
        </a>
      }
    </mat-nav-list>
  </mat-sidenav>

  <mat-sidenav-content>
    <mat-toolbar class="shell-toolbar" color="primary">
      @if (isHandset()) {
        <button mat-icon-button type="button" (click)="drawer.toggle()" aria-label="Abrir menú">
          <mat-icon>menu</mat-icon>
        </button>
      }
      <!-- <span class="shell-logo-badge">
        <img class="shell-logo" src="images/logo-easy.png" alt="Easy Cencosud" />
      </span> -->
      <span class="shell-title">MDH AR • Planificador</span>
      <span class="shell-spacer"></span>
      @if (currentUser(); as user) {
        <span class="shell-user">{{ user.firstName }} {{ user.lastName }}</span>
      }
      <button mat-icon-button type="button" (click)="logout()" aria-label="Cerrar sesión">
        <mat-icon>logout</mat-icon>
      </button>
    </mat-toolbar>

    <main class="shell-content">
      <router-outlet />
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
