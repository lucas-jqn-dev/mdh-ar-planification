<h2 mat-dialog-title>{{ data.title }}</h2>

<mat-dialog-content>
  <p class="confirm-dialog-message">{{ data.message }}</p>
</mat-dialog-content>

<mat-dialog-actions class="confirm-dialog-actions">
  <span class="confirm-dialog-spacer"></span>
  <button mat-stroked-button type="button" (click)="cancel()">{{ cancelText }}</button>
  <button mat-flat-button color="primary" type="button" (click)="confirm()">{{ confirmText }}</button>
</mat-dialog-actions>
